<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="OpenFBT patch notes and downloads."
    >

    <title>GPSoftware | OpenFBT Downloads</title>

    <link
        rel="stylesheet"
        href="../../../template/template.css"
    >

    <link
        rel="stylesheet"
        href="../../../css/main.css"

<body>


    <div id="template-header"></div>


    <main>

        <article class="product-page">

            <h1>OpenFBT releases</h1>

            <p>
                Patch notes and downloads for OpenFBT. See the

            </p>

            <section aria-labelledby="openfbt-releases-title">
                <h2 id="openfbt-releases-title">Patch notes and downloads</h2>

                <div class="updates-table-wrapper">
                    <iframe
                        class="release-embed"
                        src="OpenFBT-releases-embed.html"

                        loading="lazy"
                    ></iframe>
                </div>

                <p class="release-embed-fallback">
                    If releases do not appear here, visit the
                    <a class="information-link" href="https://github.com/Geordie-Pride-Software/OpenFBT/releases">

                    </a>.
                </p>

    <div id="template-footer"></div>


    <script src="../../../template/template.js"></script>
