<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenFBT releases</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            color: #222222;
            background: #ffffff;
        }

        body {
            margin: 0;
            padding: 1rem;
        }

        .release-list {
            display: grid;
            gap: 1rem;
        }

        .release-card {
            padding: 1.25rem;
            border: 1px solid #d6c9aa;
            border-left: 4px solid #1c6a58;
            border-radius: 6px;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: 1.5rem;
        }

        h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .release-date {
            margin: 0.5rem 0 1rem;
            color: #555555;
            font-size: 0.9rem;
        }

        .release-notes {
            line-height: 1.6;
        }

        .release-notes h3 {
            margin: 1.25rem 0 0.5rem;
            font-size: 1.05rem;
        }

        .release-notes p {
            margin: 0.75rem 0;
        }

        .release-notes ul,
        .release-notes ol {
            padding-left: 1.5rem;
        }

        .release-notes li + li {
            margin-top: 0.35rem;
        }

        .release-notes code {
            padding: 0.1rem 0.25rem;
            background: #f1f3f4;
            border-radius: 3px;
        }

        .release-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        a {
            color: #1c6a58;
        }

        .release-links a {
            display: inline-block;
            padding: 0.55rem 0.8rem;
            border: 1px solid #1c6a58;
            border-radius: 4px;
            text-decoration: none;
        }

        .release-links a:hover,
        .release-links a:focus-visible {
            background: #1c6a58;
            color: #ffffff;
        }

        .message {
            margin: 0;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <main id="releases" aria-live="polite">
        <p class="message" role="status">Loading OpenFBT releases...</p>
    </main>
    <script src="../../../js/openfbt-releases.js"></script>
</body>

</html>
