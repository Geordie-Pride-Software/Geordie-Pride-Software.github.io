<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GPSoftware | Contact</title>

    <link
        rel="stylesheet"
        href="../../template/template.css"
    >

    <link
        rel="stylesheet"
        href="../../css/main.css"
    >

    <link
        rel="stylesheet"
        href="../../css/about.css"
    >

</head>


<body>


    <!-- Header -->

    <div id="template-header"></div>


    <!-- Main Content -->

    <main class="about-page about-contact">
        <section class="contact" aria-labelledby="contact-title">
            <div class="contact-title-card">
                <p class="about-eyebrow">Get in touch</p>
                <h1 id="contact-title">Let’s start a useful conversation.</h1>
                <p class="contact-title-card-lead">
                    Have a question, an idea, or a project worth discussing? Send us a
                    message and we’ll get back to you.
                </p>
            </div>


            <form
                id="contact-form"
            >


                <!-- Layer 1: Name -->

                <div class="contact-layer">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Layer 2: Email or Phone -->

                <div class="contact-layer">

                    <label for="contact">
                        Email or Phone
                    </label>

                    <input
                        type="text"
                        id="contact"
                        name="contact"
                        placeholder="Email address or phone number"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Layer 3: Message -->

                <div class="contact-layer">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Enter your message..."
                        rows="8"
                        required
                    ></textarea>

                </div>


                <!-- Send -->

                <div class="contact-submit">

                    <button
                        id="contact-submit-button"
                        type="submit"
                    >
                        <span>Send Message</span>
                        <span aria-hidden="true">&rarr;</span>
                    </button>

                </div>


                <!-- Status -->

                <p
                    id="form-status"
                    role="status"
                    aria-live="polite"
                ></p>


            </form>

        </section>

    </main>


    <!-- Footer -->

    <div id="template-footer"></div>


    <!-- Template JavaScript -->

    <script src="../../template/template.js"></script>

    <!-- EmailJS Browser SDK -->

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- Contact JavaScript -->

    <script src="../../js/contact.js"></script>


</body>

</html>
